<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Between Frames</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" />

  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/variables.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/styles/typography.css" />
  <link rel="stylesheet" href="/styles/scenes.css" />
  <link rel="stylesheet" href="/styles/interaction.css" />
  <link rel="stylesheet" href="/styles/responsive.css" />
</head>
<body>
  <!-- Shared Three.js canvas (decorative for assistive tech; photos are described in each section) -->
  <div id="experience" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>
  <div id="cursor" aria-hidden="true"></div>

  <main id="app">
    <!-- SCENE 00 — ENTRY -->
    <section id="entry" class="entry" aria-labelledby="entry-title">
      <h1 id="entry-title" class="sr-only">Between Frames</h1>
      <div class="entry__inner">
        <p class="entry__for-you t-for-you" data-entry="for-you">For You</p>
        <p class="entry__date t-date" data-entry="date">27.09.26</p>
        <button id="enter-btn" class="entry__btn" type="button" disabled>
          <span>Enter</span>
        </button>
        <div class="entry__load" role="progressbar" aria-label="Memuat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
    </section>

    <!-- SCENES 01–10 — generated from src/content/scenes.js -->
    <div id="chapters" hidden></div>
  </main>

  <nav id="progress" class="progress" aria-label="Chapters" hidden></nav>

  <div id="controls" class="controls" hidden>
    <button id="audio-toggle" class="ctrl-audio t-index" type="button" aria-pressed="false" aria-label="Music">
      <span>sound</span>
      <span class="ctrl-audio__line" aria-hidden="true">
        <span class="waveform">
          <span class="waveform__bar"></span>
          <span class="waveform__bar"></span>
          <span class="waveform__bar"></span>
          <span class="waveform__bar"></span>
        </span>
      </span>
      <span class="ctrl-audio__state">off</span>
    </button>
  </div>

  <button id="focus-back" class="focus-back t-index" type="button" hidden>
    <span aria-hidden="true">←</span> back <span class="focus-back__key" aria-hidden="true">esc</span>
  </button>

  <audio id="bg-audio" loop preload="none"></audio>

  <noscript>
    <p class="noscript t-body">This piece needs JavaScript to open.</p>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
